[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visualthermo-plus"
version = "0.1.0"
description = "Infrared thermal image acquisition, enhancement and visualization platform"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.23",
    "matplotlib>=3.6"
]

[tool.setuptools.packages.find]
include = ["visualthermo*"]